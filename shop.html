<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1512">
<title>オンラインショップ｜モンゴリアンベーグル</title>
<meta name="description" content="モンゴリアンベーグルのオンラインショップ。フビライパンやチンギスパン、バトゥパンなど定番商品や季節限定セットをご自宅へお届けします。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M16.5 8c1.5 0 2.5 1.5 2.5 3.5s-1 3.5-2.5 3.5c-1 0-2-.5-2.5-1.5H10c-.5 1-1.5 1.5-2.5 1.5C6 15 5 13.5 5 11.5S6 8 7.5 8c1 0 2 .5 2.5 1.5h4c.5-1 1.5-1.5 2.5-1.5z'/><path d='M7 9.5c-1.5-.5-2.5-1.5-2-3s2-1.5 2.5 0'/><path d='M17 9.5c1.5-.5 2.5-1.5 2-3s-2-1.5-2.5 0'/></svg>">
<style>
:root {
  --bg-dark: #1a1512;
  --bg-light: #2c241e;
  --accent: #d4af37;
  --text-main: #f4ece2;
  --text-muted: #a89b8d;
  --font-body: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  --font-heading: "Yu Mincho", "Hiragino Mincho ProN", serif;
  --border-color: #332a23;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg-dark); color:var(--text-main); font-family:var(--font-body);}
a{color:inherit; text-decoration:none;}
img{display:block; max-width:100%;}
.wrap{width:min(1200px, 100% - 40px); margin:auto;}

/* ヘッダー */
.header{background:var(--bg-dark); padding:15px 0; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--border-color);}
.header-inner{display:flex; justify-content:space-between; align-items:center;}
.logo{display:flex; align-items:center; gap:12px; font-weight:bold; font-size:20px;}
.logo-symbol{width:36px; height:36px; border:2px solid var(--accent); border-radius:50%; display:grid; place-items:center; padding:4px;}
.nav{display:flex; gap:20px; align-items:center; font-size:13px; font-weight:bold;}
.nav a:hover{color:var(--accent);}
.cart-btn{background:var(--accent); color:var(--bg-dark); padding:8px 16px; border-radius:30px; display:flex; align-items:center; gap:8px; font-weight:bold; border:none; cursor:pointer; font-family:inherit;}
.cart-btn .count{background:var(--bg-dark); color:var(--accent); border-radius:50%; width:20px; height:20px; display:grid; place-items:center; font-size:11px;}

/* ヒーロー */
.shop-hero{padding:80px 0; text-align:center; background:linear-gradient(rgba(26,21,18,0.8), rgba(26,21,18,0.8)), url(fubilai.jpg) center/cover; border-bottom:1px solid var(--border-color);}
.shop-hero h1{font-family:var(--font-heading); font-size:40px; color:var(--accent); margin-bottom:10px;}
.shop-hero p{color:var(--text-muted); font-size:14px;}

/* 商品一覧 */
.section{padding:60px 0;}
.section-title{text-align:center; margin-bottom:40px;}
.section-title h2{font-family:var(--font-heading); font-size:28px; color:var(--accent);}
.grid-4{display:grid; grid-template-columns:repeat(4, 1fr); gap:25px;}
.product{background:var(--bg-light); border-radius:12px; overflow:hidden; cursor:pointer; transition:0.3s; position:relative;}
.product:hover{transform:translateY(-5px); box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.product .thumb{position:relative; aspect-ratio:1.1;}
.product .thumb img{width:100%; height:100%; object-fit:cover;}
.product .tag{position:absolute; top:10px; left:10px; background:var(--accent); color:var(--bg-dark); font-size:10px; font-weight:bold; padding:4px 8px; border-radius:4px;}
.product .body{padding:15px;}
.product h3{font-size:16px; margin-bottom:5px;}
.product .desc{font-size:11px; color:var(--text-muted); margin-bottom:10px; height:32px; overflow:hidden;}
.product .price-row{display:flex; justify-content:space-between; align-items:center;}
.product .price{color:var(--accent); font-size:18px; font-weight:bold;}
.product .add{background:transparent; border:1px solid var(--accent); color:var(--accent); padding:6px 12px; border-radius:20px; font-size:11px; font-weight:bold; cursor:pointer; transition:0.2s;}
.product .add:hover{background:var(--accent); color:var(--bg-dark);}

/* カートドロワー */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; opacity:0; pointer-events:none; transition:0.3s;}
.overlay.open{opacity:1; pointer-events:auto;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(400px, 100%); background:var(--bg-dark); z-index:210; transform:translateX(100%); transition:0.3s; display:flex; flex-direction:column; border-left:1px solid var(--border-color);}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:20px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;}
.drawer-head h2{color:var(--accent); font-family:var(--font-heading);}
.drawer-close{background:none; border:none; color:var(--text-main); font-size:24px; cursor:pointer;}
.drawer-body{flex:1; overflow:auto; padding:20px;}
.cart-line{display:grid; grid-template-columns:60px 1fr; gap:15px; padding:15px 0; border-bottom:1px solid var(--border-color);}
.cart-line img{width:60px; height:60px; object-fit:cover; border-radius:4px;}
.cart-line h4{font-size:14px; margin-bottom:5px;}
.cart-line .lineprice{color:var(--accent); font-weight:bold;}
.cart-line .qty{display:inline-flex; border:1px solid var(--border-color); border-radius:15px; margin-top:5px;}
.cart-line .qty button{background:var(--bg-light); border:none; color:var(--text-main); width:24px; height:24px; cursor:pointer;}
.cart-line .qty span{width:30px; text-align:center; line-height:24px; font-size:12px;}
.cart-line .remove{background:none; border:none; color:red; font-size:11px; cursor:pointer; margin-left:10px;}

/* 送料無料バー */
.free-ship-bar{height:6px; background:var(--bg-light); border-radius:3px; margin:10px 0; overflow:hidden;}
.free-ship-fill{height:100%; background:var(--accent); width:0%; transition:width 0.3s;}
.free-ship-text{font-size:11px; color:var(--accent); text-align:center; margin-bottom:15px;}

.drawer-foot{padding:20px; border-top:1px solid var(--border-color); background:var(--bg-light);}
.sum-row{display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px;}
.sum-row.total{font-size:18px; color:var(--accent); font-weight:bold; margin-top:10px; border-top:1px dashed var(--border-color); padding-top:10px;}
.checkout{width:100%; background:var(--accent); color:var(--bg-dark); border:none; padding:15px; border-radius:30px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:15px;}

/* 商品詳細・注文モーダル */
.modal{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); opacity:0; pointer-events:none; transition:0.3s;}
.modal.open{opacity:1; pointer-events:auto;}
.modal-content{background:var(--bg-light); border-radius:12px; width:min(800px, 90%); display:flex; overflow:hidden; position:relative; max-height:90vh;}
.modal-content img{width:50%; object-fit:cover;}
.modal-text{padding:40px; width:50%; display:flex; flex-direction:column; overflow:auto;}
.modal-text h2{color:var(--accent); font-family:var(--font-heading); font-size:28px; margin-bottom:15px;}
.modal-text .price{color:var(--accent); font-size:24px; font-weight:bold; margin-bottom:20px;}
.modal-text p{color:var(--text-muted); line-height:1.8; margin-bottom:20px;}
.modal-close{position:absolute; top:15px; right:15px; background:none; border:none; color:var(--text-main); font-size:24px; cursor:pointer; z-index:10;}

/* 注文フォーム */
.field{margin-bottom:15px;}
.field label{display:block; font-size:12px; color:var(--accent); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:12px; background:transparent; border:1px solid var(--border-color); border-radius:6px; color:var(--text-main); font-family:inherit; font-size:14px;}
.field input:focus{outline:none; border-color:var(--accent);}
.form-group{display:grid; grid-template-columns:1fr 1fr; gap:15px;}

.toast{position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--bg-dark); padding:15px 30px; border-radius:30px; font-weight:bold; z-index:400; opacity:0; transition:0.3s;}
.toast.show{opacity:1;}

@media (max-width: 800px) {
  .grid-4{grid-template-columns:repeat(2, 1fr); gap:15px;}
  .modal-content{flex-direction:column;}
  .modal-content img, .modal-text{width:100%;}
  .modal-content img{height:200px;}
  .form-group{grid-template-columns:1fr;}
  .nav{font-size:11px; gap:10px;}
}
</style>
</head>
<body>
<header class="header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-symbol"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 8c1.5 0 2.5 1.5 2.5 3.5s-1 3.5-2.5 3.5c-1 0-2-.5-2.5-1.5H10c-.5 1-1.5 1.5-2.5 1.5C6 15 5 13.5 5 11.5S6 8 7.5 8c1 0 2 .5 2.5 1.5h4c.5-1 1.5-1.5 2.5-1.5z"/><path d="M7 9.5c-1.5-.5-2.5-1.5-2-3s2-1.5 2.5 0"/><path d="M17 9.5c1.5-.5 2.5-1.5 2-3s-2-1.5-2.5 0"/></svg></span>
      <span>MONGOLIAN BAGEL</span>
    </a>
    <nav class="nav">
      <a href="index.html">ホーム</a>
      <a href="legal.html" style="font-size:11px;">特定商取引法</a>
      <a href="orders.html" style="font-size:11px;">管理者用</a>
      <button class="cart-btn" id="openCart">🛒 カート <span class="count" id="cartCount">0</span></button>
    </nav>
  </div>
</header>

<section class="shop-hero">
  <div class="wrap">
    <h1>ONLINE SHOP</h1>
    <p>おうちでも、ベーグル時間。全国へ冷凍便でお届けします。</p>
  </div>
</section>

<section class="wrap section">
  <div class="grid-4" id="productGrid">
    <!-- JSで描画 -->
  </div>
</section>

<!-- カートドロワー -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h2>カート</h2><button class="drawer-close" id="closeCart">×</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <div class="free-ship-text" id="freeShipText">あと ¥5,000 で送料無料！</div>
    <div class="free-ship-bar"><div class="free-ship-fill" id="freeShipFill"></div></div>
    <div class="sum-row"><span>小計</span><span id="subtotal">¥0</span></div>
    <div class="sum-row"><span>送料</span><span id="shipping">¥0</span></div>
    <div class="sum-row total"><span>合計</span><span id="total">¥0</span></div>
    <button class="checkout" id="checkoutBtn">レジへ進む</button>
  </div>
</aside>

<!-- 商品詳細モーダル -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('productModal')">×</button>
    <img src="" id="modalImg">
    <div class="modal-text">
      <h2 id="modalTitle"></h2>
      <div class="price" id="modalPrice"></div>
      <p id="modalDesc"></p>
      <div class="field">
        <label>購入方法</label>
        <select id="buyType">
          <option value="single">通常購入（1回のみ）</option>
          <option value="sub">定期購入（毎月自動配送・10%OFF）</option>
        </select>
      </div>
      <button class="checkout" onclick="addToCartFromModal()">カートに追加する</button>
    </div>
  </div>
</div>

<!-- 注文モーダル -->
<div class="modal" id="checkoutModal">
  <div class="modal-content" style="display:block; padding:40px; width:min(600px, 90%);">
    <button class="modal-close" onclick="closeModal('checkoutModal')">×</button>
    <h2 style="color:var(--accent); margin-bottom:20px; font-family:var(--font-heading);">ご注文手続き</h2>
    <form id="checkoutForm">
      <div class="form-group">
        <div class="field"><label>お名前</label><input id="f-name" required></div>
        <div class="field"><label>メールアドレス</label><input id="f-email" type="email" required></div>
      </div>
      <div class="form-group">
        <div class="field"><label>電話番号</label><input id="f-tel" type="tel" required></div>
        <div class="field"><label>郵便番号</label><input id="f-zip" required></div>
      </div>
      <div class="field"><label>住所</label><textarea id="f-addr" rows="2" required></textarea></div>
      <div class="form-group">
        <div class="field"><label>ギフト包装</label><select id="f-gift"><option>なし</option><option>熨斗あり</option><option>包装紙あり</option></select></div>
        <div class="field"><label>メッセージ</label><input id="f-msg"></div>
      </div>
      <button class="checkout" type="submit">注文を確定する（デモ）</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 商品データ
const PRODUCTS = [
  { id: "fubilai", name: "フビライパン", price: 480, img: "fubilai.jpg", tag: "看板商品", desc: "エビフライをパンに挟んだ看板商品。サクサクのエビフライと、もちもちのベーグル生地の組み合わせ。" },
  { id: "chingis", name: "チンギスパン", price: 580, img: "chingis.jpg", tag: "新商品", desc: "ジンギスカンをパンに挟んだ、食べ応え十分の一品。モンゴルの伝統的な味わいをパンで楽しめます。" },
  { id: "batu", name: "バトゥパン", price: 380, img: "batu.jpg", tag: "新商品", desc: "チャチャルガンのジャムを塗った、甘酸っぱいスイーツ系パン。" },
  { id: "plain", name: "プレーンベーグル", price: 220, img: "batu.jpg", tag: "", desc: "小麦の風味を楽しむ定番。毎朝食べたい、シンプルで力強い味わい。" }
];

const grid = document.getElementById('productGrid');
const cartBody = document.getElementById('cartBody');
const cartCount = document.getElementById('cartCount');
const subtotalEl = document.getElementById('subtotal');
const shippingEl = document.getElementById('shipping');
const totalEl = document.getElementById('total');
const freeShipFill = document.getElementById('freeShipFill');
const freeShipText = document.getElementById('freeShipText');
const STORAGE_KEY = "mongolian-bagel-cart-v2";
const ORDERS_KEY = "mongolian-bagel-orders-v1";

let cart = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
let currentModalId = null;

// 描画
function renderProducts() {
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="product" onclick="openProductModal('${p.id}')">
      <div class="thumb">
        ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
        <img src="${p.img}" alt="${p.name}">
      </div>
      <div class="body">
        <h3>${p.name}</h3>
        <div class="desc">${p.desc}</div>
        <div class="price-row">
          <div class="price">¥${p.price}</div>
          <button class="add" onclick="event.stopPropagation(); addToCart('${p.id}')">追加</button>
        </div>
      </div>
    </div>
  `).join("");
}

function renderCart() {
  const keys = Object.keys(cart);
  let count = 0;
  keys.forEach(k => count += cart[k]);
  cartCount.textContent = count;

  if(keys.length === 0) {
    cartBody.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">カートは空です。</p>';
  } else {
    cartBody.innerHTML = keys.map(k => {
      const isSub = k.includes('_sub');
      const baseId = k.replace('_sub', '');
      const p = PRODUCTS.find(x => x.id === baseId);
      const price = isSub ? Math.floor(p.price * 0.9) : p.price;
      return `
        <div class="cart-line">
          <img src="${p.img}">
          <div>
            <h4>${p.name} ${isSub ? '<span style="font-size:10px; color:#a65e28; border:1px solid #a65e28; padding:2px; border-radius:4px;">定期</span>' : ''}</h4>
            <div class="lineprice">¥${price * cart[k]}</div>
            <div class="qty">
              <button onclick="changeQty('${k}', -1)">−</button>
              <span>${cart[k]}</span>
              <button onclick="changeQty('${k}', 1)">＋</button>
            </div>
            <button class="remove" onclick="removeItem('${k}')">削除</button>
          </div>
        </div>
      `;
    }).join("");
  }

  let subtotal = 0;
  keys.forEach(k => {
    const isSub = k.includes('_sub');
    const baseId = k.replace('_sub', '');
    const p = PRODUCTS.find(x => x.id === baseId);
    subtotal += (isSub ? Math.floor(p.price * 0.9) : p.price) * cart[k];
  });
  
  const shipping = subtotal === 0 ? 0 : (subtotal >= 5000 ? 0 : 800);
  subtotalEl.textContent = "¥" + subtotal;
  shippingEl.textContent = shipping === 0 ? "無料" : "¥" + shipping;
  totalEl.textContent = "¥" + (subtotal + shipping);

  // 送料無料バー
  if(subtotal === 0) {
    freeShipText.textContent = "あと ¥5,000 で送料無料！";
    freeShipFill.style.width = "0%";
  } else if(subtotal < 5000) {
    freeShipText.textContent = `あと ¥${5000 - subtotal} で送料無料！`;
    freeShipFill.style.width = (subtotal / 5000 * 100) + "%";
  } else {
    freeShipText.textContent = "送料無料になりました！";
    freeShipFill.style.width = "100%";
  }
}

function addToCart(id, isSub = false) {
  const actualId = isSub ? id + "_sub" : id;
  cart[actualId] = (cart[actualId] || 0) + 1;
  saveCart();
  renderCart();
  showToast("カートに追加しました");
}

function changeQty(id, delta) {
  cart[id] += delta;
  if(cart[id] <= 0) delete cart[id];
  saveCart();
  renderCart();
}

function removeItem(id) {
  delete cart[id];
  saveCart();
  renderCart();
}

function saveCart() { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }

// モーダル
function openProductModal(id) {
  const p = PRODUCTS.find(x => x.id === id);
  currentModalId = id;
  document.getElementById('modalImg').src = p.img;
  document.getElementById('modalTitle').textContent = p.name;
  document.getElementById('modalPrice').textContent = "¥" + p.price;
  document.getElementById('modalDesc').textContent = p.desc;
  document.getElementById('productModal').classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function addToCartFromModal() {
  const isSub = document.getElementById('buyType').value === 'sub';
  addToCart(currentModalId, isSub);
  closeModal('productModal');
}

// 注文
document.getElementById('checkoutBtn').onclick = () => {
  if(Object.keys(cart).length === 0) { showToast("カートが空です"); return; }
  document.getElementById('checkoutModal').classList.add('open');
};

document.getElementById('checkoutForm').onsubmit = (e) => {
  e.preventDefault();
  
  let subtotal = 0;
  let items = [];
  Object.keys(cart).forEach(k => {
    const isSub = k.includes('_sub');
    const baseId = k.replace('_sub', '');
    const p = PRODUCTS.find(x => x.id === baseId);
    const price = isSub ? Math.floor(p.price * 0.9) : p.price;
    subtotal += price * cart[k];
    items.push({ name: p.name + (isSub ? " (定期)" : ""), qty: cart[k], price: price });
  });
  const shipping = subtotal >= 5000 ? 0 : 800;
  
  const orderData = {
    id: 'ORD-' + Date.now(),
    date: new Date().toLocaleString('ja-JP'),
    name: document.getElementById('f-name').value,
    email: document.getElementById('f-email').value,
    tel: document.getElementById('f-tel').value,
    zip: document.getElementById('f-zip').value,
    address: document.getElementById('f-addr').value,
    gift: document.getElementById('f-gift').value,
    msg: document.getElementById('f-msg').value,
    items: items,
    total: subtotal + shipping
  };

  let orders = JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
  orders.push(orderData);
  localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));

  showToast("ご注文ありがとうございました！");
  cart = {};
  saveCart();
  renderCart();
  closeModal('checkoutModal');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  e.target.reset();
};

// カート開閉
document.getElementById('openCart').onclick = () => {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
};
document.getElementById('closeCart').onclick = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
};

// トースト
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 初期化
renderProducts();
renderCart();
</script>
</body>
</html>
