<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理者ダッシュボード｜モンゴリアンベーグル</title>
<style>
:root { --bg-dark: #1a1512; --bg-light: #2c241e; --accent: #d4af37; --text-main: #f4ece2; --text-muted: #a89b8d; --border: #332a23; }
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg-dark); color:var(--text-main); font-family:"Helvetica Neue", Arial, sans-serif; padding:20px;}
.wrap{max-width:1000px; margin:auto;}
.header{display:flex; justify-content:space-between; border-bottom:2px solid var(--accent); padding-bottom:15px; margin-bottom:30px; align-items:center;}
h1{color:var(--accent); font-size:24px;}
.nav-btn{color:var(--accent); border:1px solid var(--accent); padding:8px 16px; border-radius:20px; text-decoration:none; font-size:12px; margin-left:10px; background:none; cursor:pointer; font-family:inherit;}
.panel{background:var(--bg-light); padding:25px; border-radius:10px; margin-bottom:30px; border-top:3px solid var(--accent);}
.panel h2{font-size:18px; color:var(--accent); margin-bottom:15px;}
.form-group{display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;}
.field label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px;}
.field input, .field textarea, .field select{width:100%; padding:10px; background:transparent; border:1px solid var(--border); border-radius:6px; color:#fff; font-family:inherit;}
.btn{background:var(--accent); color:var(--bg-dark); border:none; padding:12px 24px; border-radius:30px; font-weight:bold; cursor:pointer; margin-top:10px;}
.btn:hover{opacity:0.8;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th, td{border-bottom:1px solid var(--border); padding:12px; text-align:left;}
th{color:var(--accent);}
.btn-edit{background:transparent; color:var(--accent); border:1px solid var(--accent); padding:5px 10px; border-radius:15px; cursor:pointer; font-size:11px; margin-right:5px;}
.btn-del{background:transparent; color:red; border:1px solid red; padding:5px 10px; border-radius:15px; cursor:pointer; font-size:11px;}
#loginScreen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:80vh;}
#loginScreen input{padding:12px; width:300px; margin-bottom:15px; border-radius:6px; border:1px solid var(--border); background:transparent; color:#fff;}
#editModal{position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:100;}
#editModal .modal-box{background:var(--bg-light); padding:30px; border-radius:10px; width:500px; max-width:90%;}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginScreen">
    <h2 style="color:var(--accent); margin-bottom:20px;">管理者ログイン</h2>
    <input type="password" id="adminPass" placeholder="パスワード">
    <button class="btn" id="loginBtn">ログイン</button>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="header">
      <h1>管理画面</h1>
      <div>
        <a href="index.html" class="nav-btn">サイトを見る</a>
        <a href="shop.html" class="nav-btn">ショップ</a>
        <a href="orders.html" class="nav-btn">注文管理</a>
        <button class="nav-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <!-- 商品追加 -->
    <div class="panel">
      <h2>新商品の追加</h2>
      <div class="form-group">
        <div class="field"><label>商品名</label><input id="p-name"></div>
        <div class="field"><label>価格</label><input id="p-price" type="number"></div>
      </div>
      <div class="form-group">
        <div class="field"><label>画像URL (例: fubilai.jpg)</label><input id="p-img"></div>
        <div class="field"><label>タグ (空欄可)</label><input id="p-tag"></div>
      </div>
      <div class="field"><label>商品説明</label><textarea id="p-desc" rows="2"></textarea></div>
      <button class="btn" onclick="addProduct()">商品を追加する</button>
    </div>

    <!-- 商品一覧（編集削除） -->
    <div class="panel">
      <h2>現在の商品一覧</h2>
      <table>
        <thead><tr><th>画像</th><th>商品名</th><th>価格</th><th>操作</th></tr></thead>
        <tbody id="productList"></tbody>
      </table>
    </div>

    <!-- レビュー管理 -->
    <div class="panel">
      <h2>お客様レビューの管理</h2>
      <div id="reviewList"></div>
    </div>

    <!-- お知らせ追加 -->
    <div class="panel">
      <h2>お知らせの追加</h2>
      <div class="form-group">
        <div class="field"><label>日付</label><input id="n-date"></div>
        <div class="field"><label>タグ</label><input id="n-tag"></div>
      </div>
      <div class="field"><label>タイトル</label><input id="n-title"></div>
      <button class="btn" onclick="addNews()">お知らせを追加する</button>
    </div>
  </div>
</div>

<!-- 編集モーダル -->
<div id="editModal">
  <div class="modal-box">
    <h2 style="color:var(--accent); margin-bottom:15px;">商品を編集</h2>
    <input type="hidden" id="edit-id">
    <div class="field" style="margin-bottom:10px;"><label>商品名</label><input id="edit-name" style="width:100%; padding:10px; background:transparent; border:1px solid var(--border); color:#fff;"></div>
    <div class="field" style="margin-bottom:10px;"><label>価格</label><input id="edit-price" type="number" style="width:100%; padding:10px; background:transparent; border:1px solid var(--border); color:#fff;"></div>
    <div class="field" style="margin-bottom:20px;"><label>説明</label><textarea id="edit-desc" rows="3" style="width:100%; padding:10px; background:transparent; border:1px solid var(--border); color:#fff;"></textarea></div>
    <button class="btn" onclick="saveEdit()">保存する</button>
    <button class="btn" style="background:transparent; color:var(--text-muted); border:1px solid var(--border); margin-left:10px;" onclick="document.getElementById('editModal').style.display='none'">キャンセル</button>
  </div>
</div>

<script>
const PASSWORD = "admin1234";
const DEFAULT_PRODUCTS = [
  { id: "fubilai", name: "フビライパン", price: 480, img: "fubilai.jpg", tag: "看板商品", desc: "エビフライをパンに挟んだ看板商品。" },
  { id: "chingis", name: "チンギスパン", price: 580, img: "chingis.jpg", tag: "新商品", desc: "ジンギスカンをパンに挟んだ一品。" },
  { id: "batu", name: "バトゥパン", price: 380, img: "batu.jpg", tag: "新商品", desc: "チャチャルガンのジャムを塗ったスイーツ系。" },
  { id: "plain", name: "プレーンベーグル", price: 220, img: "batu.jpg", tag: "", desc: "小麦の風味を楽しむ定番。" }
];

if(sessionStorage.getItem('adminAuth') === 'true') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  render();
}
document.getElementById('loginBtn').onclick = () => {
  if(document.getElementById('adminPass').value === PASSWORD) {
    sessionStorage.setItem('adminAuth', 'true');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    render();
  } else { alert('パスワードが違います'); }
};
function logout() { sessionStorage.removeItem('adminAuth'); location.reload(); }

function getProducts() {
  let data = localStorage.getItem('mb_products');
  if(!data) { localStorage.setItem('mb_products', JSON.stringify(DEFAULT_PRODUCTS)); return DEFAULT_PRODUCTS; }
  return JSON.parse(data);
}

function render() {
  const pList = document.getElementById('productList');
  pList.innerHTML = getProducts().map(p => `
    <tr>
      <td><img src="${p.img}" width="40" height="40" style="object-fit:cover; border-radius:4px;"></td>
      <td>${p.name}</td>
      <td>¥${p.price}</td>
      <td>
        <button class="btn-edit" onclick="openEdit('${p.id}')">編集</button>
        <button class="btn-del" onclick="deleteProduct('${p.id}')">削除</button>
      </td>
    </tr>
  `).join('');

  // レビュー表示
  const reviews = JSON.parse(localStorage.getItem('mb_reviews')) || {};
  const rList = document.getElementById('reviewList');
  let rHtml = '';
  Object.keys(reviews).forEach(pid => {
    reviews[pid].forEach((r, idx) => {
      rHtml += `
        <div style="border-bottom:1px solid var(--border); padding:10px 0; font-size:13px;">
          <b>${pid}</b> - 星${r.star} : ${r.text} <span style="color:var(--text-muted);">(${r.date})</span>
          <button class="btn-del" style="float:right;" onclick="deleteReview('${pid}', ${idx})">削除</button>
        </div>
      `;
    });
  });
  rList.innerHTML = rHtml || '<p style="color:var(--text-muted);">まだレビューはありません。</p>';
}

function addProduct() {
  const name = document.getElementById('p-name').value;
  const price = document.getElementById('p-price').value;
  const img = document.getElementById('p-img').value;
  const tag = document.getElementById('p-tag').value;
  const desc = document.getElementById('p-desc').value;
  if(!name || !price) return alert("商品名と価格は必須です");

  const products = getProducts();
  products.push({
    id: 'custom_' + Date.now(),
    name: name, price: Number(price),
    img: img || "batu.jpg", tag: tag, desc: desc
  });
  localStorage.setItem('mb_products', JSON.stringify(products));
  
  document.getElementById('p-name').value = '';
  document.getElementById('p-price').value = '';
  document.getElementById('p-img').value = '';
  document.getElementById('p-tag').value = '';
  document.getElementById('p-desc').value = '';
  render();
  alert("商品を追加しました！");
}

function deleteProduct(id) {
  if(!confirm("本当に削除しますか？")) return;
  let products = getProducts().filter(p => p.id !== id);
  localStorage.setItem('mb_products', JSON.stringify(products));
  render();
}

// ★ 商品編集
function openEdit(id) {
  const p = getProducts().find(x => x.id === id);
  document.getElementById('edit-id').value = p.id;
  document.getElementById('edit-name').value = p.name;
  document.getElementById('edit-price').value = p.price;
  document.getElementById('edit-desc').value = p.desc || '';
  document.getElementById('editModal').style.display = 'flex';
}

function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('edit-name').value;
  const price = document.getElementById('edit-price').value;
  const desc = document.getElementById('edit-desc').value;

  let products = getProducts();
  const idx = products.findIndex(x => x.id === id);
  if(idx > -1) {
    products[idx].name = name;
    products[idx].price = Number(price);
    products[idx].desc = desc;
    localStorage.setItem('mb_products', JSON.stringify(products));
    document.getElementById('editModal').style.display = 'none';
    render();
    alert("商品を更新しました！");
  }
}

// お知らせ
function addNews() {
  const date = document.getElementById('n-date').value;
  const tag = document.getElementById('n-tag').value;
  const title = document.getElementById('n-title').value;
  if(!date || !title) return alert("日付とタイトルは必須です");

  let news = JSON.parse(localStorage.getItem('mb_news')) || [];
  news.unshift({ date: date, tag: tag || "NEWS", title: title });
  localStorage.setItem('mb_news', JSON.stringify(news));
  
  document.getElementById('n-date').value = '';
  document.getElementById('n-tag').value = '';
  document.getElementById('n-title').value = '';
  alert("お知らせを追加しました！");
}

function deleteReview(pid, index) {
  if(!confirm("このレビューを削除しますか？")) return;
  let reviews = JSON.parse(localStorage.getItem('mb_reviews')) || {};
  reviews[pid].splice(index, 1);
  localStorage.setItem('mb_reviews', JSON.stringify(reviews));
  render();
}
</script>
</body>
</html>
