<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f2e8">
<title>注文管理｜モンゴリアンベーグル</title>
<style>
:root{--site-primary:#76251f;--site-background:#f8f2e8;--site-on-background:#34251e;--line:#e4d5c0;--muted:#77695b}
*{box-sizing:border-box}body{margin:0;background:var(--site-background);color:var(--site-on-background);font-family:"Yu Gothic",sans-serif;padding:40px 20px}
.wrap{max-width:1000px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--site-primary);padding-bottom:16px;margin-bottom:24px}
h1{font-size:24px;color:var(--site-primary);margin:0}
a{color:var(--site-primary);text-decoration:none;font-size:14px;font-weight:bold;border:1px solid var(--site-primary);padding:8px 16px;border-radius:20px}
a:hover{background:var(--site-primary);color:#fff}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;background:#fffaf2;}
.admin-table th,.admin-table td{border:1px solid var(--line);padding:12px;text-align:left;vertical-align:top;}
.admin-table th{background:#f3e7d5;color:var(--site-primary);white-space:nowrap;}
.admin-table tr:hover{background:#faf5ec;}
.empty{text-align:center;padding:40px;color:var(--muted);border:1px dashed var(--line);}
.item-list{list-style:none;padding:0;margin:0;font-size:12px;line-height:1.6}
.btn-clear{background:none;border:0;color:#a92e28;text-decoration:underline;cursor:pointer;font-size:12px;margin-top:20px;}
.btn-csv{background:var(--site-primary);color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:bold;margin-bottom:20px;}
.btn-csv:hover{opacity:0.8;}

/* ダッシュボード */
.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px;}
.dash-card{background:#fffaf2;border:1px solid var(--line);padding:20px;border-radius:8px;text-align:center;}
.dash-card h3{font-size:12px;color:var(--muted);margin:0 0 8px;}
.dash-card .val{font-size:24px;font-weight:bold;color:var(--site-primary);}

/* ログイン画面 */
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;}
#loginScreen input{padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px;width:100%;max-width:300px;margin-bottom:16px;font-family:inherit;}
#loginScreen button{padding:12px 40px;background:var(--site-primary);color:#fff;border:none;border-radius:30px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;}
#loginScreen .error{color:#a92e28;font-size:12px;margin-top:10px;display:none;}
#mainContent{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginScreen">
    <h2 style="color:var(--site-primary);">管理者ログイン</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px;">パスワードを入力してください。</p>
    <input type="password" id="passwordInput" placeholder="パスワード">
    <button id="loginBtn">ログイン</button>
    <div class="error" id="errorMsg">パスワードが違います。</div>
  </div>

  <div id="mainContent">
    <div class="header">
      <h1>注文管理・売上ダッシュボード</h1>
      <div>
        <a href="shop.html">ショップに戻る</a>
        <button class="btn-clear" id="logoutBtn" style="margin-left:10px;border:1px solid #a92e28;color:#a92e28;padding:8px 16px;border-radius:20px;">ログアウト</button>
      </div>
    </div>
    
    <div class="dashboard">
      <div class="dash-card">
        <h3>総売上</h3>
        <div class="val" id="totalSales">¥0</div>
      </div>
      <div class="dash-card">
        <h3>注文数</h3>
        <div class="val" id="totalOrders">0</div>
      </div>
      <div class="dash-card">
        <h3>平均注文単価</h3>
        <div class="val" id="avgOrder">¥0</div>
      </div>
    </div>

    <button class="btn-csv" id="downloadCsv">CSVダウンロード</button>
    <div id="orderList"></div>
    <button class="btn-clear" id="clearBtn">注文履歴をすべて削除する</button>
  </div>
</div>

<script>
(function(){
  const ORDERS_KEY = "mongolian-bagel-orders-v1";
  const PASSWORD = "admin1234"; 
  let ordersData = [];

  const loginScreen = document.getElementById("loginScreen");
  const mainContent = document.getElementById("mainContent");

  if(sessionStorage.getItem("adminAuth") === "true"){
    showMain();
  }

  document.getElementById("loginBtn").onclick = () => {
    if(document.getElementById("passwordInput").value === PASSWORD){
      sessionStorage.setItem("adminAuth", "true");
      showMain();
    } else {
      document.getElementById("errorMsg").style.display = "block";
    }
  };

  document.getElementById("logoutBtn").onclick = () => {
    sessionStorage.removeItem("adminAuth");
    location.reload();
  };

  function showMain(){
    loginScreen.style.display = "none";
    mainContent.style.display = "block";
    loadAndRender();
  }

  function loadAndRender(){
    try { ordersData = JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; } catch(e){ ordersData = []; }
    
    // ダッシュボード計算
    let totalSales = 0;
    ordersData.forEach(o => totalSales += o.total);
    document.getElementById("totalSales").textContent = "¥" + totalSales.toLocaleString();
    document.getElementById("totalOrders").textContent = ordersData.length;
    document.getElementById("avgOrder").textContent = ordersData.length ? "¥" + Math.floor(totalSales / ordersData.length).toLocaleString() : "¥0";

    // リスト描画
    if(ordersData.length === 0){
      document.getElementById("orderList").innerHTML = '<div class="empty">注文データがありません。</div>';
      return;
    }

    const reversed = [...ordersData].reverse();
    let html = '<table class="admin-table"><thead><tr><th>注文ID / 日時</th><th>お客様情報 / ギフト</th><th>注文商品</th><th>合計金額</th></tr></thead><tbody>';
    
    reversed.forEach(o => {
      let itemsHtml = '<ul class="item-list">';
      o.items.forEach(i => itemsHtml += `<li>${i.name} × ${i.qty}（¥${i.price.toLocaleString()}）</li>`);
      itemsHtml += '</ul>';

      html += `<tr>
        <td style="white-space:nowrap"><b>${o.id}</b><br>${o.date}</td>
        <td><b>${o.name} 様</b><br>${o.email}<br>${o.tel}<br>〒${o.zip}<br>${o.address}<br><span style="color:#a92e28">ギフト: ${o.gift||'なし'} ${o.msg?'(Msg: '+o.msg+')':''}</span></td>
        <td>${itemsHtml}</td>
        <td style="font-weight:bold;color:var(--site-primary);font-size:15px;">¥${o.total.toLocaleString()}</td>
      </tr>`;
    });
    document.getElementById("orderList").innerHTML = html + '</tbody></table>';
  }

  document.getElementById("downloadCsv").onclick = () => {
    if(ordersData.length === 0) return alert("データがありません");
    let csv = "注文ID,日時,名前,メール,電話,住所,ギフト,メッセージ,商品詳細,合計金額\n";
    ordersData.forEach(o => {
      const itemsStr = o.items.map(i => `${i.name}x${i.qty}`).join(' / ');
      csv += `"${o.id}","${o.date}","${o.name}","${o.email}","${o.tel}","${o.address}","${o.gift||''}","${o.msg||''}","${itemsStr}",${o.total}\n`;
    });
    const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' }); // BOM付きでExcel文字化け防止
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `orders_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  };

  document.getElementById("clearBtn").onclick = () => {
    if(confirm("本当にすべての注文履歴を削除しますか？")){
      localStorage.removeItem(ORDERS_KEY);
      loadAndRender();
    }
  };
})();
</script>
</body></html>
