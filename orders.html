<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1512">
<title>注文管理｜モンゴリアンベーグル</title>
<style>
:root { --bg-dark: #1a1512; --bg-light: #2c241e; --accent: #d4af37; --text-main: #f4ece2; --text-muted: #a89b8d; }
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg-dark); color:var(--text-main); font-family:"Helvetica Neue", Arial, sans-serif; padding:40px 20px;}
.wrap{max-width:1000px; margin:auto;}
.header{display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--accent); padding-bottom:15px; margin-bottom:30px;}
h1{font-size:24px; color:var(--accent);}
.btn{color:var(--accent); border:1px solid var(--accent); padding:8px 16px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer; background:transparent; text-decoration:none;}
.btn:hover{background:var(--accent); color:var(--bg-dark);}

.admin-table{width:100%; border-collapse:collapse; font-size:13px; background:var(--bg-light); border-radius:8px; overflow:hidden;}
.admin-table th, .admin-table td{border-bottom:1px solid #332a23; padding:15px; text-align:left; vertical-align:top;}
.admin-table th{background:#221b17; color:var(--accent);}
.admin-table tr:hover{background:#332a23;}

.dashboard{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:30px;}
.dash-card{background:var(--bg-light); padding:20px; border-radius:8px; text-align:center; border-top:3px solid var(--accent);}
.dash-card h3{font-size:12px; color:var(--text-muted); margin-bottom:10px;}
.dash-card .val{font-size:24px; font-weight:bold; color:var(--accent);}

#loginScreen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh;}
#loginScreen input{padding:15px; width:100%; max-width:300px; background:var(--bg-light); border:1px solid #332a23; color:var(--text-main); border-radius:8px; margin-bottom:15px;}
#loginScreen button{padding:15px 40px; background:var(--accent); color:var(--bg-dark); border:none; border-radius:30px; font-weight:bold; cursor:pointer;}
#mainContent{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginScreen">
    <h2 style="color:var(--accent); margin-bottom:20px;">管理者ログイン</h2>
    <input type="password" id="passwordInput" placeholder="パスワード">
    <button id="loginBtn">ログイン</button>
    <p id="errorMsg" style="color:red; display:none; margin-top:10px; font-size:12px;">パスワードが違います</p>
  </div>

  <div id="mainContent">
    <div class="header">
      <h1>注文管理・売上ダッシュボード</h1>
      <div>
        <a href="shop.html" class="btn">ショップに戻る</a>
        <button class="btn" id="logoutBtn">ログアウト</button>
      </div>
    </div>
    
    <div class="dashboard">
      <div class="dash-card"><h3>総売上</h3><div class="val" id="totalSales">¥0</div></div>
      <div class="dash-card"><h3>注文数</h3><div class="val" id="totalOrders">0</div></div>
      <div class="dash-card"><h3>平均注文単価</h3><div class="val" id="avgOrder">¥0</div></div>
    </div>

    <button class="btn" id="downloadCsv" style="margin-bottom:20px;">CSVダウンロード</button>
    <div id="orderList"></div>
    <button class="btn" id="clearBtn" style="margin-top:20px; color:red; border-color:red;">注文履歴をすべて削除する</button>
  </div>
</div>

<script>
const PASSWORD = "admin1234";
const ORDERS_KEY = "mongolian-bagel-orders-v1";
let ordersData = [];

if(sessionStorage.getItem("adminAuth") === "true") showMain();

document.getElementById("loginBtn").onclick = () => {
  if(document.getElementById("passwordInput").value === PASSWORD){
    sessionStorage.setItem("adminAuth", "true");
    showMain();
  } else {
    document.getElementById("errorMsg").style.display = "block";
  }
};

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("adminAuth");
  location.reload();
};

function showMain(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadAndRender();
}

function loadAndRender(){
  try { ordersData = JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; } catch(e){ ordersData = []; }
  
  let totalSales = 0;
  ordersData.forEach(o => totalSales += o.total);
  document.getElementById("totalSales").textContent = "¥" + totalSales.toLocaleString();
  document.getElementById("totalOrders").textContent = ordersData.length;
  document.getElementById("avgOrder").textContent = ordersData.length ? "¥" + Math.floor(totalSales / ordersData.length).toLocaleString() : "¥0";

  if(ordersData.length === 0){
    document.getElementById("orderList").innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:40px;">注文データがありません。</p>';
    return;
  }

  let html = '<table class="admin-table"><thead><tr><th>注文ID / 日時</th><th>お客様情報</th><th>注文商品</th><th>合計金額</th></tr></thead><tbody>';
  [...ordersData].reverse().forEach(o => {
    let itemsHtml = '<ul style="list-style:none; padding:0;">';
    o.items.forEach(i => itemsHtml += `<li>${i.name} × ${i.qty}（¥${i.price.toLocaleString()}）</li>`);
    itemsHtml += '</ul>';

    html += `<tr>
      <td style="white-space:nowrap"><b>${o.id}</b><br>${o.date}</td>
      <td><b>${o.name} 様</b><br>${o.email}<br>${o.tel}<br>〒${o.zip}<br>${o.address}</td>
      <td>${itemsHtml}</td>
      <td style="font-weight:bold; color:var(--accent); font-size:16px;">¥${o.total.toLocaleString()}</td>
    </tr>`;
  });
  document.getElementById("orderList").innerHTML = html + '</tbody></table>';
}

document.getElementById("downloadCsv").onclick = () => {
  if(ordersData.length === 0) return alert("データがありません");
  let csv = "注文ID,日時,名前,メール,電話,住所,商品詳細,合計金額\n";
  ordersData.forEach(o => {
    const itemsStr = o.items.map(i => `${i.name}x${i.qty}`).join(' / ');
    csv += `"${o.id}","${o.date}","${o.name}","${o.email}","${o.tel}","${o.address}","${itemsStr}",${o.total}\n`;
  });
  const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `orders_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
};

document.getElementById("clearBtn").onclick = () => {
  if(confirm("本当にすべての注文履歴を削除しますか？")){
    localStorage.removeItem(ORDERS_KEY);
    loadAndRender();
  }
};
</script>
</body></html>
