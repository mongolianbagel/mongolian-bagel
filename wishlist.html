<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お気に入り｜モンゴリアンベーグル</title>
<style>
:root { --bg-dark: #1a1512; --bg-light: #2c241e; --accent: #d4af37; --text-main: #f4ece2; --text-muted: #a89b8d; --border: #332a23; }
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg-dark); color:var(--text-main); font-family:"Helvetica Neue", Arial, sans-serif;}
.wrap{width:min(1000px, 100% - 40px); margin:auto; padding:40px 0;}
.header{display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--accent); padding-bottom:15px; margin-bottom:30px;}
h1{color:var(--accent); font-size:24px;}
a{color:var(--accent); text-decoration:none; border:1px solid var(--accent); padding:8px 16px; border-radius:20px; font-size:12px;}
.grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;}
.card{background:var(--bg-light); border-radius:10px; overflow:hidden; padding:15px; text-align:center;}
.card img{width:100%; height:150px; object-fit:cover; border-radius:6px; margin-bottom:10px;}
.card h3{font-size:15px; margin-bottom:5px;}
.card .price{color:var(--accent); font-weight:bold;}
.empty{text-align:center; color:var(--text-muted); margin-top:50px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>お気に入り一覧（ウィッシュリスト）</h1>
    <a href="index.html">ホームに戻る</a>
  </div>
  <div class="grid" id="wishGrid"></div>
</div>

<script>
// お気に入りデータの読み込み
let wishlist = JSON.parse(localStorage.getItem('mb_wishlist')) || [];

// 商品データを取得
const stored = localStorage.getItem('mb_products');
const PRODUCTS = stored ? JSON.parse(stored) : [
  { id: "fubilai", name: "フビライパン", price: 480, img: "fubilai.jpg" },
  { id: "chingis", name: "チンギスパン", price: 580, img: "chingis.jpg" },
  { id: "batu", name: "バトゥパン", price: 380, img: "batu.jpg" },
  { id: "plain", name: "プレーンベーグル", price: 220, img: "batu.jpg" }
];

const grid = document.getElementById('wishGrid');
if(wishlist.length === 0) {
  grid.innerHTML = '<p class="empty">お気に入りに登録された商品はありません。</p>';
} else {
  wishlist.forEach(id => {
    const p = PRODUCTS.find(x => x.id === id);
    if(p) {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <div class="price">¥${p.price}</div>
        </div>
      `;
    }
  });
}
</script>
</body>
</html>
